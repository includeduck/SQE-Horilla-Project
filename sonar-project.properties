# SonarQube analysis config for the SE3002 SQE team project (Area 1).
# Used both locally (pysonar against http://localhost:9000) and in CI.
sonar.projectKey=sqe-horilla
sonar.projectName=SQE Horilla (Leave module focus)
sonar.projectVersion=2.4.0-sqe

sonar.language=py
sonar.python.version=3.12
sonar.sourceEncoding=UTF-8

# Whole first-party Python code base is analysed (brief: "Run SonarQube on the
# project"); the leave module is the focus of the report.
sonar.sources=.
sonar.inclusions=**/*.py

# Not first-party application logic: generated migrations, demo fixtures,
# vendored front-end assets, virtualenv, and test code (counted as tests below).
sonar.exclusions=**/migrations/**,load_data/**,static/**,media/**,templates/**,\
  .venv/**,docs/**,scripts/**,**/tests/**,**/test_*.py,tests/**

sonar.tests=.
sonar.test.inclusions=**/tests/**/*.py,**/test_*.py,tests/team/**/*.py
sonar.test.exclusions=.venv/**

# Coverage from pytest-cov (generated by the team unit tests; absent on the
# first baseline scan, so coverage starts at 0%).
sonar.python.coverage.reportPaths=coverage.xml
