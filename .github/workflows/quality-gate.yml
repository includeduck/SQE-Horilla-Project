# Area 1 CI quality gate (owner: Muhammad Wasay Tariq, 24I-3071).
# Every pull request into sqe-team must pass all checks below before it can be
# merged (the "gate" job is a required status check), and the deploy job only
# runs after a green gate on sqe-team. Thresholds: docs/team/ci/gate-thresholds.json,
# justified in docs/team/reports/CI_QUALITY_GATE.md.
#
# No escape hatches: no continue-on-error, no "|| true"; every piped command
# runs with pipefail so a failing test cannot be hidden by tee.
name: Quality gate

on:
  pull_request:
    branches: [sqe-team]
  push:
    branches: [sqe-team]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  SONARQUBE_IMAGE: sonarqube:26.10.0.133078-community

jobs:
  unit:
    name: Unit tests + 100% scoped coverage
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install application and unit-test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcairo2 libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 libffi8 shared-mime-info
          bash .github/scripts/install-requirements.sh
          python -m pip install -r tests/team/requirements-unit.txt
      - name: Run unit tests with branch coverage
        run: |
          set -o pipefail
          python -m pytest -c tests/team/pytest-unit.ini tests/team/unit \
            --cov=leave --cov=horilla_api.api_views.leave --cov-branch \
            --cov-report=json:coverage.json --cov-report=xml:coverage.xml \
            --junitxml=unit-results.xml 2>&1 | tee unit-results.txt
      - name: Enforce 100% statement and branch coverage of scoped business logic
        run: |
          set -o pipefail
          python tests/team/unit/coverage_scope.py coverage.json | tee coverage-scope.txt
          { echo '### Scoped coverage'; echo '```'; cat coverage-scope.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-${{ github.run_id }}
          path: |
            coverage.xml
            coverage.json
            unit-results.xml
            unit-results.txt
            coverage-scope.txt
          if-no-files-found: error

  api:
    name: API and integration tests (Area 2 suite)
    uses: ./.github/workflows/finish02-coverage.yml
    with:
      full_scope: true

  e2e:
    name: Browser end-to-end tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: tests/team:tests/team/api:tests/team/generator:.
      E2E_EVIDENCE: docs/team/evidence/ci/e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install application, Playwright and Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcairo2 libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 libffi8 shared-mime-info
          bash .github/scripts/install-requirements.sh
          python -m pip install -r tests/team/requirements-phase-d.txt
          python -m playwright install --with-deps chromium
      - name: Run browser use-case tests
        run: |
          mkdir -p "$E2E_EVIDENCE"
          set -o pipefail
          python -m pytest -c tests/team/pytest-area2.ini tests/team/e2e -v -o junit_family=xunit1 \
            --junitxml="$E2E_EVIDENCE/browser.xml" 2>&1 | tee "$E2E_EVIDENCE/browser.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-${{ github.run_id }}
          path: docs/team/evidence/ci/e2e/
          if-no-files-found: error

  sonar:
    name: SonarQube quality gate
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      sonarqube:
        image: sonarqube:26.10.0.133078-community
        ports: ["9000:9000"]
        env:
          SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    env:
      SONAR_HOST_URL: http://localhost:9000
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: unit-${{ github.run_id }}
      - name: Install scanner
        run: python -m pip install "pysonar==1.11.0.6012"
      - name: Configure server, project and quality gate
        run: python tests/team/ci/sonar_gate.py setup
      - name: Analyse with unit coverage
        run: pysonar --sonar-host-url="$SONAR_HOST_URL" --token="$SONAR_TOKEN"
      - name: Enforce SonarQube quality gate
        run: python tests/team/ci/sonar_gate.py check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sonar-${{ github.run_id }}
          path: docs/team/evidence/ci/sonar-gate.json
          if-no-files-found: warn

  mutation:
    name: Mutation testing (mutmut)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install application, unit-test tools and mutmut
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcairo2 libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 libffi8 shared-mime-info
          bash .github/scripts/install-requirements.sh
          python -m pip install -r tests/team/requirements-unit.txt "mutmut==3.8.1"
          cp docs/team/env.example .env
          sed -i "s/^SECRET_KEY=.*/SECRET_KEY=ci-mutation-$(python -c 'import secrets;print(secrets.token_hex(16))')/" .env
      - name: Run mutmut with custom business-rule operators
        run: |
          set -o pipefail
          python tests/team/mutation/run_mutmut.py run 2>&1 | tail -n 40
      - name: Summarise and enforce score and equivalent-mutant list
        run: |
          python tests/team/mutation/analyse.py --out docs/team/evidence/ci/mutation
          python tests/team/ci/mutation_gate.py docs/team/evidence/ci/mutation/summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-${{ github.run_id }}
          path: docs/team/evidence/ci/mutation/
          if-no-files-found: warn

  gate:
    # The single required status check. It must run even when a check fails,
    # because GitHub treats a *skipped* required check as passing.
    name: gate
    needs: [unit, api, e2e, sonar, mutation]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every check to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | python -c "
          import json, sys
          needs = json.load(sys.stdin)
          rows = [f'| {k} | {v[\"result\"]} |' for k, v in needs.items()]
          print('\n'.join(['### Quality gate', '', '| Check | Result |', '|---|---|'] + rows))
          bad = [k for k, v in needs.items() if v['result'] != 'success']
          sys.exit(f'Blocked: {bad}' if bad else 0)
          " | tee -a "$GITHUB_STEP_SUMMARY"
          test "${PIPESTATUS[1]}" -eq 0

  deploy:
    # Deployment is gated too: it only runs for sqe-team after a green gate.
    name: Deploy staging bundle
    needs: gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/sqe-team' && needs.gate.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build release bundle
        run: |
          mkdir -p dist
          git archive --format=tar.gz -o "dist/horilla-sqe-${GITHUB_SHA::12}.tar.gz" HEAD
          sha256sum dist/*.tar.gz | tee dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: staging-bundle-${{ github.sha }}
          path: dist/
          if-no-files-found: error
