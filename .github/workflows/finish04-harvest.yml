name: Finish 04 evidence harvest
on:
  push:
    branches: [rayyan/final-closeout]
    paths: [".github/workflows/finish04-harvest.yml"]
permissions:
  contents: read
  actions: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 95
    strategy:
      fail-fast: false
      matrix:
        population: [summary, generated]
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Require successful pinned complete API run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json,os,time,urllib.request
          url="https://api.github.com/repos/${{ github.repository }}/actions/runs/45627793460"
          for attempt in range(270):
              req=urllib.request.Request(url,headers={"Authorization":"Bearer "+os.environ["GH_TOKEN"],"Accept":"application/vnd.github+json"})
              with urllib.request.urlopen(req,timeout=30) as response:r=json.load(response)
              assert r["head_sha"]=="aeed7b7ba049a79589b8e9ac0b4abb52bec28d0e"
              if r["status"]=="completed":
                  assert r["conclusion"]=="success",r["conclusion"]
                  print("PINNED_API_ACCEPTED",r["id"],r["head_sha"],flush=True);break
              time.sleep(20)
          else:raise SystemExit("Pinned full API verification still incomplete")
          PY
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 45627793460
          name: finish02-coverage-45627793460
          path: evidence
      - name: Export only genuine machine-derived rows in bounded chunks
        env:
          POPULATION: ${{ matrix.population }}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          names=["PROMPT03_EXECUTION_SUMMARY.json","PROMPT03_INPUT_LEDGER.json","PROMPT03_REQUIREMENT_EVIDENCE.json"] if os.environ["POPULATION"]=="summary" else ["PROMPT03_GENERATED_LEDGER.json"]
          for name in names:
              paths=list(Path("evidence").rglob(name))
              assert len(paths)==1,(name,len(paths))
              value=json.loads(paths[0].read_text())
              assert value["tested_source_sha"]=="aeed7b7ba049a79589b8e9ac0b4abb52bec28d0e"
              data=json.dumps(value,separators=(",",":"))
              for offset in range(0,len(data),8000):
                  print("FINAL_EVIDENCE_CHUNK "+json.dumps({"name":name,"index":offset//8000,"total":(len(data)+7999)//8000,"text":data[offset:offset+8000]}),flush=True)
          PY
