# Area 1 mutation testing (mutmut 3). Run from WSL/Linux only (needs fork):
#   python tests/team/mutation/run_mutmut.py run
# See docs/team/reports/MUTATION_TESTING.md.
[mutmut]
# Business-rule module: the three files holding the scoped W1/W2 rules.
source_paths =
    leave/
    horilla_api/
only_mutate =
    leave/models.py
    leave/methods.py
    horilla_api/api_views/leave/views.py
# Only lines the unit tests execute are mutated; the run is further narrowed to
# the 15 scoped functions by run_mutmut.py.
mutate_only_covered_lines = true
pytest_add_cli_args =
    -c
    tests/team/pytest-unit.ini
    -p
    no:warnings
pytest_add_cli_args_test_selection = tests/team/unit
# Django loads every installed app, so the mutants/ copy needs them unchanged.
also_copy =
    manage.py
    accessibility
    asset
    attendance
    auth
    base
    biometric
    dynamic_fields
    employee
    facedetection
    geofencing
    helpdesk
    horilla
    horilla_audit
    horilla_auth
    horilla_automations
    horilla_backup
    horilla_crumbs
    horilla_dbtemplate
    horilla_documents
    horilla_ldap
    horilla_meet
    horilla_theme
    horilla_tour
    horilla_views
    horilla_widgets
    master_import
    notifications
    offboarding
    onboarding
    outlook_auth
    payroll
    pg_backup
    pms
    project
    recruitment
    report
    templates
    whatsapp
    .env
